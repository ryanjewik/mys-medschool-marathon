# Runs on every `git commit`. One-time setup per clone:  pre-commit install
# Run on everything manually:                            pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          # Skips `terraform init` against a real backend; only needs providers.
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # Python (api/): lint + format. Config lives in api/pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # TypeScript (web/): type-check. Needs `npm install` in web/ first.
  - repo: local
    hooks:
      - id: web-typecheck
        name: TypeScript typecheck (web)
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/.*\.(ts|tsx|json)$
        pass_filenames: false
